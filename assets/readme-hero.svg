<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">CasePaste for Salesforce</title>
  <description id="description">Paste images into Case Feed posts, save them to Case Files, and keep moving. Click to jump to installation.</description>
  <defs>
    <linearGradient id="bg" x1="42" y1="18" x2="1158" y2="402" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171426"/>
      <stop offset=".53" stop-color="#25204A"/>
      <stop offset="1" stop-color="#4436A3"/>
    </linearGradient>
    <linearGradient id="accent" x1="83" y1="69" x2="462" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A89CFF"/>
      <stop offset="1" stop-color="#7362FF"/>
    </linearGradient>
    <linearGradient id="warm" x1="838" y1="237" x2="1098" y2="364" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC58E"/>
      <stop offset="1" stop-color="#FF9C5A"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#B8AEFF" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="34" fill="url(#dots)"/>
  <circle cx="1057" cy="-42" r="230" fill="#8A76FF" opacity=".13"/>
  <circle cx="69" cy="447" r="200" fill="#FF9D5A" opacity=".08"/>

  <g transform="translate(70 56)">
    <rect width="237" height="34" rx="17" fill="#FFFFFF" opacity=".1"/>
    <circle cx="18" cy="17" r="5" fill="#6BE0A7"/>
    <text x="32" y="22" fill="#E7E3FF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">CHROME × SALESFORCE</text>

    <text x="0" y="117" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="72" font-weight="800" letter-spacing="-4">CasePaste</text>
    <text x="2" y="157" fill="#C8C1F7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="600">Paste the image. Skip the interruption.</text>

    <g transform="translate(0 202)">
      <rect width="118" height="46" rx="13" fill="url(#accent)"/>
      <path d="M24 15h17a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V19a4 4 0 0 1 4-4Z" fill="none" stroke="#fff" stroke-width="2.3"/>
      <circle cx="28" cy="22" r="2.2" fill="#fff"/>
      <path d="m22 32 7-7 5 5 4-4 5 6" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3"/>
      <text x="57" y="29" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750">PASTE</text>

      <path d="M142 23h45" stroke="#8D83C6" stroke-width="2" stroke-dasharray="4 5"/>
      <path d="m180 18 7 5-7 5" fill="none" stroke="#8D83C6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>

      <rect x="210" width="122" height="46" rx="13" fill="#FFFFFF" opacity=".1"/>
      <path d="M229 18v15m-6-6 6 6 6-6M221 15h16" fill="none" stroke="#D7D1FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
      <text x="247" y="29" fill="#E7E3FF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750">FILES</text>

      <path d="M356 23h45" stroke="#8D83C6" stroke-width="2" stroke-dasharray="4 5"/>
      <path d="m394 18 7 5-7 5" fill="none" stroke="#8D83C6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>

      <rect x="424" width="122" height="46" rx="13" fill="#FFFFFF" opacity=".1"/>
      <path d="m443 25 5 5 10-11" fill="none" stroke="#6BE0A7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
      <text x="468" y="29" fill="#E7E3FF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750">INLINE</text>
    </g>

    <g transform="translate(0 280)">
      <text x="0" y="18" fill="#ADA5DF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="650">CLICK THIS BANNER TO INSTALL</text>
      <path d="M220 13h62m-8-7 8 7-8 7" fill="none" stroke="#FFB777" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    </g>
