    <rect width="388" height="48" rx="24" fill="#EEEFF5"/>
    <path d="M0 24C0 10.745 10.745 0 24 0h340c13.255 0 24 10.745 24 24v24H0V24Z" fill="#EEEFF5"/>
    <circle cx="24" cy="24" r="5" fill="#FF8B83"/>
    <circle cx="42" cy="24" r="5" fill="#FFC96C"/>
    <circle cx="60" cy="24" r="5" fill="#68D49E"/>
    <rect x="88" y="15" width="222" height="18" rx="9" fill="#D7D8E2"/>
    <text x="25" y="83" fill="#272A38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750">POST</text>
    <rect x="24" y="98" width="340" height="140" rx="12" fill="#FFFFFF" stroke="#D9DAE4" stroke-width="2"/>
    <rect x="42" y="116" width="139" height="8" rx="4" fill="#E1E2E9"/>
    <rect x="42" y="134" width="95" height="8" rx="4" fill="#E1E2E9"/>

    <g transform="translate(184 154)">
      <rect width="145" height="63" rx="10" fill="#ECE9FF"/>
      <circle cx="31" cy="31" r="16" fill="#7B69FF"/>
      <path d="M24 31h14m-7-7v14" stroke="#fff" stroke-linecap="round" stroke-width="2.4"/>
      <text x="56" y="27" fill="#3E376C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="750">IMAGE READY</text>
      <text x="56" y="44" fill="#77718F" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9">Files + inline</text>
    </g>

    <g transform="translate(26 254)">
      <rect width="336" height="37" rx="11" fill="#29263B"/>
      <circle cx="20" cy="18.5" r="9" fill="url(#warm)"/>
      <path d="m16 18.5 3 3 5-6" fill="none" stroke="#4A2E1E" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/>
      <text x="38" y="15" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" font-weight="750">PASTE LANDED</text>
      <text x="38" y="27" fill="#BDB8D2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="7.7">Saved to Case Files and placed inline.</text>
    </g>
  </g>

  <path d="m1044 195 39 14-17 8 12 23-12 6-12-23-16 11 6-39Z" fill="#FFAE69" stroke="#403588" stroke-linejoin="round" stroke-width="5"/>
</svg>
